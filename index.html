<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2056 能源分配模擬器</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>2056 能源分配模擬器</h1>
      <p class="subtitle">能源過剩之後，問題不是「夠不夠」，而是「怎麼分」。</p>
    </div>
  </header>

  <div class="layout">
    <!-- ===== 我的資料 ===== -->
    <aside class="panel controls">
      <div class="group first">
        <span class="group-title">我的資料</span>
        <label class="field">
          <span class="field-label">居住地區</span>
          <select id="myRegion"></select>
        </label>
        <label class="field">
          <span class="field-label">職業／產業</span>
          <select id="myOccupation"></select>
        </label>
        <div class="field">
          <span class="field-label">特殊需求</span>
          <div id="mySpecial" class="checks"></div>
        </div>
        <label class="field">
          <span class="field-label">本期已用額度 <output id="usedOut"></output></span>
          <input type="range" id="myUsed" min="0" max="5" step="0.01" />
          <span class="hint" id="usedHint"></span>
        </label>
      </div>
    </aside>

    <!-- ===== 結果 ===== -->
    <main class="content">
      <section class="panel me">
        <div class="section-head">
          <h2>我的能源</h2>
        </div>
        <div class="stats" id="meStats"></div>
        <div id="meChart" class="chart"></div>
        <div class="me-legend" id="meLegend"></div>
        <p class="hint" id="meNote"></p>
      </section>

    </main>
  </div>

  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>

  <script src="js/model.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
